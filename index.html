<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOBXP | Tu primera experiencia laboral</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="js/evaluaciones.js"></script>
</head>

<body>
    <!-- Navbar Superior (Desktop) -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom fixed-top d-none d-lg-flex"
        aria-label="Navegación principal">
        <div class="container-fluid px-4">
            <a class="navbar-brand labxp-brand" href="#/home">JOB<span>XP</span></a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 fw-medium">
                    <li class="nav-item"><a class="nav-link" href="#/home">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#/explorar">Explorar experiencias</a></li>
                    <li class="nav-item"><a class="nav-link" href="#/como-funciona">Cómo funciona</a></li>
                    <li class="nav-item"><a class="nav-link" href="#/inclusion">Inclusión</a></li>
                    <li class="nav-item"><a class="nav-link" href="#/empresa">Para empresas</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <a href="#/login" class="btn btn-outline-primary rounded-pill px-4 text-decoration-none">Iniciar
                        sesión</a>
                    <a href="#/registro" class="btn btn-primary rounded-pill px-4 text-decoration-none">Registrarme</a>
                    <button onclick="UI.logout()" class="btn btn-light rounded-pill px-3 text-secondary border"><i
                            class="bi bi-box-arrow-right"></i> Salir</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header Mobile -->
    <header
        class="d-lg-none bg-white border-bottom fixed-top px-3 py-2 d-flex justify-content-between align-items-center">
        <a href="#/home" class="labxp-brand mobile-brand">JOB<span>XP</span></a>
        <div class="d-flex align-items-center gap-2"><a href="#/login" class="small fw-semibold text-dark text-decoration-none">Entrar</a><a href="#/registro" class="btn btn-primary btn-sm rounded-pill px-3">Crear cuenta</a></div>
    </header>

    <!-- Contenedor Principal (Vistas dinámicas) -->
    <main id="app-content" class="container-fluid" style="margin-top: 70px; margin-bottom: 80px;"></main>

    <!-- Navegación Inferior (Mobile) -->
    <nav class="mobile-nav d-lg-none fixed-bottom bg-white border-top d-flex justify-content-around py-2">
        <a href="#/home" class="text-center text-decoration-none text-secondary active-nav">
            <i class="bi bi-house-door fs-4 d-block"></i>
            <span class="small">Inicio</span>
        </a>
        <a href="#/explorar" class="text-center text-decoration-none text-secondary">
            <i class="bi bi-search fs-4 d-block"></i>
            <span class="small">Explorar</span>
        </a>
        <a href="#/pasaporte" class="text-center text-decoration-none text-secondary">
            <i class="bi bi-award fs-4 d-block"></i>
            <span class="small">Pasaporte</span>
        </a>
        <a href="#/perfil" class="text-center text-decoration-none text-secondary">
            <i class="bi bi-person fs-4 d-block"></i>
            <span class="small">Perfil</span>
        </a>
    </nav>

    <!-- Scripts (Orden de dependencias) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/match.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/evaluaciones.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
